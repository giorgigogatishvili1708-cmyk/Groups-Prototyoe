<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Groups" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="" />
  <title>BoG · Groups prototype</title>
  <link rel="stylesheet" href="/src/fonts.css" />
  <link rel="stylesheet" href="/src/tokens/tokens.css" />
  <link rel="stylesheet" href="/src/layout/layout.css" />
  <link rel="stylesheet" href="/src/app.css" />
  <link rel="stylesheet" href="/src/ds/ds.css">
</head>
<body>
  <div id="root"></div>
  <script>
    // Boot check: if the app has not rendered after 6 s, show why on the page instead of a blank screen.
    (function () {
      var errs = [];
      addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? ' @ ' + String(e.filename).slice(0, 60) + ':' + e.lineno : '')); });
      addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.childElementCount) return;
        var ok = typeof HTMLScriptElement !== 'undefined' && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap');
        root.textContent = 'Prototype did not start. ' + (ok ? '' : 'This browser does not support import maps; please update Safari/Chrome or use start.command. ') + (errs.join(' | ') || 'No error reported.') + ' — ' + navigator.userAgent;
      }, 6000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
